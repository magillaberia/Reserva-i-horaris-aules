<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EHT Cambrils - Reserva en Temps Real</title>
    <style>
        :root { --taronja: #FF8C00; --blanc: #ffffff; --gris: #f4f4f4; }
        body { font-family: sans-serif; background: var(--gris); margin: 0; padding: 0; }
        header { background: var(--blanc); padding: 20px; border-bottom: 5px solid var(--taronja); text-align: center; }
        .container { max-width: 600px; margin: 20px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status-box { padding: 20px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 20px; font-size: 1.2rem; }
        .lliure { background: #d4edda; color: #155724; }
        .ocupat { background: #f8d7da; color: #721c24; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
        button { background: var(--taronja); color: white; border: none; cursor: pointer; font-weight: bold; }
        .reserva { border-left: 4px solid var(--taronja); padding: 10px; margin: 10px 0; background: #fafafa; }
    </style>
</head>
<body>

<header>
    <h1>EHT CAMBRILS</h1>
    <p>Aula d'Estudi / Saleta de Reunions</p>
</header>

<div class="container">
    <div id="estatAula" class="status-box lliure">Carregant estat...</div>

    <form id="reservaForm">
        <h3>Fer una reserva</h3>
        <input type="text" id="usuari" placeholder="El teu nom" required>
        <select id="rol">
            <option value="Alumne">Soc Alumne (Estudi)</option>
            <option value="Professor">Soc Professor (Reunió)</option>
        </select>
        <input type="datetime-local" id="dataHora" required>
        <input type="number" id="durada" placeholder="Durada (minuts)" value="60">
        <button type="submit">Reservar Ara</button>
    </form>

    <hr>
    <h3>Horari de reserves</h3>
    <div id="llistaReserves"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // TODO: Substitueix això amb la teva configuració de Firebase
  const firebaseConfig = {
    apiKey: "LA_TEVA_API_KEY",
    authDomain: "EL_TEU_PROJECTE.firebaseapp.com",
    projectId: "EL_TEU_PROJECTE",
    storageBucket: "EL_TEU_PROJECTE.appspot.com",
    messagingSenderId: "ID",
    appId: "ID_APP"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const colRef = collection(db, "reserves");

  // 1. ESCRIURE DADES (Quan algú clica el botó)
  const form = document.getElementById('reservaForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    await addDoc(colRef, {
      nom: document.getElementById('usuari').value,
      rol: document.getElementById('rol').value,
      inici: new Date(document.getElementById('dataHora').value).getTime(),
      durada: parseInt(document.getElementById('durada').value),
      timestamp: Date.now()
    });
    form.reset();
  });

  // 2. LLEGIR DADES EN TEMPS REAL (Sincronitza tots els dispositius automàticament)
  const q = query(colRef, orderBy("inici", "asc"));
  onSnapshot(q, (snapshot) => {
    const llista = document.getElementById('llistaReserves');
    const estatDiv = document.getElementById('estatAula');
    let html = "";
    let aulaOcupada = false;
    const ara = Date.now();

    snapshot.docs.forEach(doc => {
      const r = doc.data();
      const final = r.inici + (r.durada * 60000);
      const dataText = new Date(r.inici).toLocaleString('ca-ES');

      // Comprovar si l'aula està ocupada ARA mateix
      if (ara >= r.inici && ara <= final) {
        aulaOcupada = true;
        estatDiv.innerText = `OCUPADA per ${r.nom} (${r.rol})`;
        estatDiv.className = "status-box ocupat";
      }

      // Afegir a la llista visual
      html += `<div class="reserva">
                <strong>${dataText}</strong><br>
                ${r.nom} (${r.rol}) - ${r.durada} min.
               </div>`;
    });

    if (!aulaOcupada) {
      estatDiv.innerText = "DESOCUPADA - Disponible";
      estatDiv.className = "status-box lliure";
    }
    llista.innerHTML = html;
  });
</script>

</body>
</html>
