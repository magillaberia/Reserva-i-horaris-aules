<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestió Aules EHT Cambrils</title>
    <style>
        :root { --taronja: #FF8C00; --blanc: #ffffff; --gris: #f4f4f4; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--gris); padding-bottom: 50px; }
        header { background: var(--blanc); border-bottom: 5px solid var(--taronja); padding: 15px; text-align: center; }
        .container { max-width: 900px; margin: 20px auto; padding: 15px; }
        .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: var(--taronja); color: white; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button#btnReservar { background: var(--taronja); color: white; font-weight: bold; border: none; cursor: pointer; }
        .badge { padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .prof { background: #ffe5d0; color: var(--taronja); }
        .alumne { background: #e0f0ff; color: #007bff; }
    </style>
</head>
<body>

<header>
    <h2>EHT CAMBRILS - Reserves</h2>
</header>

<div class="container">
    <div class="panel">
        <label>Selecciona l'Aula:</label>
        <select id="aulaActiva">
            <option value="estudi">Aula d'Estudi / Saleta Reunions</option>
            <option value="tecnologica">Aula Tecnològica</option>
            <option value="magna">Aula Magna</option>
            <option value="informatica">Informàtica</option>
        </select>
    </div>

    <div class="panel">
        <h3>Nova Reserva</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <input type="text" id="nom" placeholder="El teu nom" required>
            <select id="rol">
                <option value="Alumne">Soc Alumne</option>
                <option value="Professor">Soc Professor</option>
            </select>
            <input type="datetime-local" id="dataHora" required>
            <select id="durada">
                <option value="30">30 minuts</option>
                <option value="60" selected>1 hora</option>
                <option value="120">2 hores</option>
            </select>
        </div>
        <button id="btnReservar">Confirmar Reserva</button>
    </div>

    <div class="panel">
        <h3>Calendari de Reserves</h3>
        <table id="taulaCompleta">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Usuari</th>
                    <th>Tipus</th>
                    <th>Aula</th>
                    <th>Acció</th>
                </tr>
            </thead>
            <tbody id="taulaReserves"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA15QYnYR6Ze0ITIUba-2BKTxMmMr2_JcU",
      authDomain: "aula-cambrils-9ce8a.firebaseapp.com",
      projectId: "aula-cambrils-9ce8a",
      storageBucket: "aula-cambrils-9ce8a.firebasestorage.app",
      messagingSenderId: "949766108403",
      appId: "1:949766108403:web:c47aeb962ff1342fbcf386"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "reserves_v3");

    // FUNCIÓ PER RESERVAR
    document.getElementById('btnReservar').onclick = async () => {
        const nom = document.getElementById('nom').value;
        const rol = document.getElementById('rol').value;
        const dataVal = document.getElementById('dataHora').value;
        const durada = parseInt(document.getElementById('durada').value);
        const aula = document.getElementById('aulaActiva').value;

        if(!nom || !dataVal) return alert("Omple el nom i la data");

        try {
            await addDoc(colRef, {
                nom, rol, aula, durada,
                inici: new Date(dataVal).getTime(),
                timestamp: Date.now()
            });
            alert("Reserva guardada!");
            document.getElementById('nom').value = "";
        } catch (error) {
            console.error(error);
            alert("Error de Firebase: " + error.message);
        }
    };

    // LLEGIR EN TEMPS REAL
    const q = query(colRef, orderBy("inici", "asc"));
    onSnapshot(q, (snapshot) => {
        const tbody = document.getElementById('taulaReserves');
        tbody.innerHTML = "";
        snapshot.forEach((docSnap) => {
            const r = docSnap.data();
            const id = docSnap.id;
            const fila = document.createElement('tr');
            const dataStr = new Date(r.inici).toLocaleString('ca-ES', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
            
            fila.innerHTML = `
                <td>${dataStr}</td>
                <td>${r.nom}</td>
                <td><span class="badge ${r.rol === 'Professor' ? 'prof' : 'alumne'}">${r.rol}</span></td>
                <td>${r.aula}</td>
                <td><button onclick="eliminar('${id}', '${r.nom}')" style="background:red; color:white; border:none; padding:5px; cursor:pointer; border-radius:4px;">X</button></td>
            `;
            tbody.appendChild(fila);
        });
    });

    // FUNCIÓ ELIMINAR
    window.eliminar = async (id, propietari) => {
        const pass = prompt("Escriu el teu nom o el codi ADMIN per esborrar:");
        if(pass === "CAMBRILS2024" || pass === propietari) {
            await deleteDoc(doc(db, "reserves_v3", id));
        } else {
            alert("No autoritzat");
        }
    };
</script>
</body>
</html>
